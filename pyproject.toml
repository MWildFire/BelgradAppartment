[project]
name = "otz-rent-finder"
version = "0.1.0"
description = "Apartment finder automation for @OtzRentBelgrad Telegram channel"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Darya & Dmitriy" }]
dependencies = [
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.2",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "selectolax>=0.3.21",
    "playwright>=1.45.0",
    "playwright-stealth>=2.0",
    "imagehash>=4.3.1",
    "Pillow>=10.4.0",
    "qrcode>=7.4.2",
    "telethon>=1.36.0",
    "aiogram>=3.10.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10.4",
    "click>=8.1.7",
    "pyyaml>=6.0.2",
    "fake-useragent>=1.5.1",
    "anthropic>=0.40",
    "uvicorn[standard]>=0.30.6",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
clip = [
    "open-clip-torch>=2.24.0",
    "torch>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-pyyaml",
    "respx>=0.21.1",
]

[project.scripts]
otz = "src.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "ASYNC"]
ignore = ["B008"]  # FastAPI's Depends() pattern

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["telethon.*", "imagehash.*", "selectolax.*", "fake_useragent.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
