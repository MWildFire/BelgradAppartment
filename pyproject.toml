[project]
name = "otz-rent-finder"
version = "0.1.0"
description = "Apartment finder automation for @OtzRentBelgrad Telegram channel"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Darya & Dmitriy" }]
dependencies = [
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosmtplib>=3.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.2",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "selectolax>=0.3.21",
    "playwright>=1.45.0",
    "playwright-stealth>=2.0",
    "imagehash>=4.3.1",
    "Pillow>=10.4.0",
    "opencv-python-headless>=4.13",
    "qrcode>=7.4.2",
    "telethon>=1.36.0",
    "aiogram>=3.10.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10.4",
    "click>=8.1.7",
    "pyyaml>=6.0.2",
    "fake-useragent>=1.5.1",
    "anthropic>=0.40",
    "uvicorn[standard]>=0.30.6",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
clip = [
    "open-clip-torch>=2.24.0",
    "torch==2.12.0",
    "torchvision==0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-pyyaml",
    "respx>=0.21.1",
]

[project.scripts]
otz = "src.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "ASYNC"]
ignore = ["B008"]  # FastAPI's Depends() pattern

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["telethon.*", "imagehash.*", "selectolax.*", "fake_useragent.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Keep the 8 September production runtime stable while repairing application behavior.
[tool.uv]
constraint-dependencies = [
    "aiofiles==25.1.0",
    "aiogram==3.28.2",
    "aiohappyeyeballs==2.6.1",
    "aiohttp==3.13.5",
    "aiosignal==1.4.0",
    "aiosmtplib==5.1.2",
    "aiosqlite==0.22.1",
    "alembic==1.18.4",
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anthropic==0.103.1",
    "anyio==4.13.0",
    "APScheduler==3.11.2",
    "attrs==26.1.0",
    "certifi==2026.4.22",
    "click==8.4.0",
    "distro==1.9.0",
